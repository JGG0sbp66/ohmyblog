name: Bug 反馈
description: 报告一个可复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 Bug！请尽量提供可复现的步骤，这样能更快定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地描述这个 Bug 是什么。
      placeholder: 例如：保存文章后封面图丢失……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何一步步重现这个问题？
      placeholder: |
        1. 进入「……」
        2. 点击「……」
        3. 出现错误……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？实际发生了什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OhMyBlog 版本
      description: 在「管理后台 → 系统信息」或镜像 tag 中查看，例如 v1.3.7。
      placeholder: v1.3.7
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker（docker-compose）
        - Docker（单容器 / 其他编排）
        - 源码编译运行
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 服务端与浏览器相关信息。
      value: |
        - 服务端系统：（如 Ubuntu 22.04 / NAS 型号）
        - 浏览器：（如 Chrome 126）
        - 数据库：SQLite（默认）
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        如有报错，请粘贴 `data/logs/error.log` 或容器日志的相关片段。
        日志会自动按代码块格式化，无需手动添加 ```。
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 如果有助于说明问题，可以附上截图或直接拖拽上传。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他任何相关的上下文。
    validations:
      required: false
