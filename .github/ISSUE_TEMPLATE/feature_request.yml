name: ✨ 功能建议
description: 提出一个新功能或改进 / suggest a new feature or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！描述清楚「为什么需要」比「要怎么做」更重要。

  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 这个功能想解决什么问题？在什么场景下需要它？
      placeholder: 例如：目前文章列表无法按标签筛选，找历史文章很麻烦……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 清晰描述你期望的功能是什么样子的，可以附上界面草图或参考产品的截图。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有其他可以考虑的方案？为什么不如这个？
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他任何相关的上下文。
    validations:
      required: false
