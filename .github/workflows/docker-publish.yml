# 所有 action 一律 pin 到完整 commit SHA（注释保留版本号便于对读）。
# 尤其 deploy 里的 appleboy/ssh-action 持有 VPS root 私钥，任一 action 仓库
# 被接管、tag 被挪动，按 tag 引用就会让攻击者的代码拿到这些凭据。
# 升级时：查目标版本的 tag → 找到它指向的 commit（注意 annotated tag 要
# 用剥壳后的 SHA）→ 替换这里并同步更新注释。
name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jgg0sbp66/ohmyblog

jobs:
  # 自动创建 Release 并生成 Release Notes
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Generate changelog from commits
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # 按 commit message 前缀分类
          FEATS=$(git log $RANGE --pretty=format:"- %s" --grep="^feat" --regexp-ignore-case)
          FIXES=$(git log $RANGE --pretty=format:"- %s" --grep="^fix" --regexp-ignore-case)
          CI=$(git log $RANGE --pretty=format:"- %s" --grep="^ci" --regexp-ignore-case)
          CHORES=$(git log $RANGE --pretty=format:"- %s" --grep="^chore" --regexp-ignore-case)
          # 其他不匹配前缀的 commit
          ALL=$(git log $RANGE --pretty=format:"%s")
          OTHERS=""
          while IFS= read -r line; do
            if ! echo "$line" | grep -qiE "^(feat|fix|ci|chore)"; then
              OTHERS="$OTHERS- $line\n"
            fi
          done <<< "$ALL"

          # 拼接 changelog
          BODY=""
          if [ -n "$FEATS" ]; then
            BODY="${BODY}## ✨ 新功能\n${FEATS}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}## 🐛 Bug 修复\n${FIXES}\n\n"
          fi
          if [ -n "$CI" ]; then
            BODY="${BODY}## 🔧 CI/CD\n${CI}\n\n"
          fi
          if [ -n "$CHORES" ]; then
            BODY="${BODY}## 🧹 其他维护\n${CHORES}\n\n"
          fi
          if [ -n "$OTHERS" ]; then
            BODY="${BODY}## 📝 其他\n${OTHERS}\n"
          fi

          # 添加 Full Changelog 链接
          if [ -n "$PREV_TAG" ]; then
            BODY="${BODY}**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
          fi

          # 添加下载表格
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          DL_BASE="https://github.com/${REPO}/releases/download/${{ github.ref_name }}"

          BODY="${BODY}\n\n---\n\n"
          BODY="${BODY}### 📦 下载\n\n"
          BODY="${BODY}| 平台 | 下载 |\n"
          BODY="${BODY}|------|------|\n"
          BODY="${BODY}| Linux | [![glibc](https://img.shields.io/badge/tar.gz-glibc-blue?style=flat-square&logo=linux&logoColor=white)](${DL_BASE}/ohmyblog-linux-x64.tar.gz)<br>[![musl](https://img.shields.io/badge/tar.gz-musl-blue?style=flat-square&logo=alpine-linux&logoColor=white)](${DL_BASE}/ohmyblog-linux-x64-musl.tar.gz)<br>[![docker](https://img.shields.io/badge/Docker-ghcr.io-2496ED?style=flat-square&logo=docker&logoColor=white)](https://ghcr.io/jgg0sbp66/ohmyblog) |\n"
          BODY="${BODY}| Windows | [![x64](https://img.shields.io/badge/zip-x64-0078D4?style=flat-square&logo=data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTAgMy4wMWwxMC4xLTEuMzd2OS43NUgwVjMuMDFNMTEuMiAxLjQ3TDI0IDB2MTEuNEgxMS4yVjEuNDdNMCAxMi41aDEwLjF2OS43NUwwIDIwLjk5VjEyLjVNMTEuMiAxMi42SDI0djExLjRMMTEuMiAyMi41VjEyLjYiLz48L3N2Zz4=)](${DL_BASE}/ohmyblog-windows-x64.exe.zip) |\n"
          BODY="${BODY}| macOS | [![Apple Silicon](https://img.shields.io/badge/tar.gz-Apple_Silicon-black?style=flat-square&logo=apple&logoColor=white)](${DL_BASE}/ohmyblog-macos-arm64.tar.gz) |\n"

          echo -e "$BODY" > release_notes.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release_notes.md
          draft: true

  # 构建多平台二进制文件并上传到 Release Assets
  build-binaries:
    runs-on: ubuntu-latest
    needs: create-release

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - platform: linux
            artifact_name: ohmyblog-linux-x64
          - platform: linux-musl
            artifact_name: ohmyblog-linux-x64-musl
          - platform: win
            artifact_name: ohmyblog-windows-x64.exe
          - platform: mac
            artifact_name: ohmyblog-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install backend dependencies
        run: bun install --frozen-lockfile
        working-directory: ohmyblog-backend

      - name: Sync version from tag
        # 编译版运行时回退读 package.json（编译期内联），发版构建以 tag 为准覆盖，
        # 仓库里的 version 从此不需要手动维护
        run: npm pkg set version "${GITHUB_REF_NAME#v}"
        working-directory: ohmyblog-backend

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: ohmyblog-frontend

      - name: Type-check and build frontend
        run: bun run build
        working-directory: ohmyblog-frontend

      - name: Copy frontend dist to backend
        run: cp -r ohmyblog-frontend/dist ohmyblog-backend/frontend-dist

      - name: Build binary for ${{ matrix.platform }}
        run: bun run scripts/build.ts ${{ matrix.platform }}
        working-directory: ohmyblog-backend

      - name: Package binary
        run: |
          cd ohmyblog-backend/scripts/dist/${{ matrix.platform }}
          if [ "${{ matrix.platform }}" = "win" ]; then
            zip -r ../../../../${{ matrix.artifact_name }}.zip .
          else
            tar -czf ../../../../${{ matrix.artifact_name }}.tar.gz .
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ matrix.platform == 'win' && format('{0}.zip', matrix.artifact_name) || format('{0}.tar.gz', matrix.artifact_name) }}

  # 构建并推送 Docker 镜像
  build-docker:
    runs-on: ubuntu-latest
    needs: create-release

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ohmyblog-backend/scripts/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}

  # 二进制和 Docker 镜像均构建成功后发布同一 tag 的草稿 Release
  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - build-docker

    permissions:
      contents: write

    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false

  # 镜像推送完成后自动部署到国内 VPS；部署失败不阻止正式 Release 发布
  deploy:
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ssh-action 不负责传文件；把仓库中的 Compose 编成单行，通过同一 SSH
      # 环境变量传到 VPS，避免远端长期维护一份会与仓库漂移的副本。
      - name: Prepare Demo Compose
        id: demo-compose
        shell: bash
        run: |
          echo "content=$(base64 -w 0 docker-compose.demo.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy Demo to VPS over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_VERSION: ${{ github.ref_name }}
          DEMO_COMPOSE_B64: ${{ steps.demo-compose.outputs.content }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: IMAGE_VERSION,DEMO_COMPOSE_B64
          script: |
            set -e
            cd /root/docker/container/ohmyblog

            # 原子替换为本次 tag 对应仓库里的 Demo Compose，避免远端配置漂移。
            printf '%s' "$DEMO_COMPOSE_B64" | base64 -d > docker-compose.demo.yml.tmp
            mv docker-compose.demo.yml.tmp docker-compose.demo.yml

            # ref 形如 v1.3.6，镜像 tag 是 1.3.6，去掉前缀 v
            echo "IMAGE_TAG=${IMAGE_VERSION#v}" > .env

            # 拉取失败（网络抖动 / 镜像站偶发同步延迟）等 30 秒重试
            ok=0
            for i in $(seq 1 10); do
              if docker compose -f docker-compose.demo.yml pull; then ok=1; break; fi
              echo "第 $i 次拉取失败，30 秒后重试"
              sleep 30
            done
            [ "$ok" = "1" ] || { echo "镜像拉取失败，放弃本次部署"; exit 1; }

            docker compose -f docker-compose.demo.yml up -d
            docker image prune -f

            # 等容器恢复 healthy，最多 90 秒，超时打出日志让 Actions 报错
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' ohmyblog)" = "healthy" ] && exit 0
              sleep 3
            done
            echo "容器启动后 90 秒内未恢复 healthy"
            docker compose -f docker-compose.demo.yml logs --tail 50
            exit 1
